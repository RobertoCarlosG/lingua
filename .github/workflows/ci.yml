name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    env:
      # Placeholders — mismo check que Vercel; no se usan en runtime de los tests
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key
      VITE_API_URL: https://placeholder.example.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Unit tests (lib)
        run: yarn workspace lingua-frontend test:unit

      - name: UI tests (components + integración)
        run: yarn workspace lingua-frontend test:ui

      - name: Production build
        run: yarn workspace lingua-frontend build

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: pytest

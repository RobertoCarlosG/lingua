sections:
  - title: "Katakana: el silabario de lo extranjero"
    type: explanation
    content: |
      El katakana tiene exactamente los mismos sonidos que el hiragana, pero se usa en
      situaciones distintas. Aprenderlo es muy motivador para hispanohablantes porque
      podrás leer muchísimas palabras que reconocerás del español o el inglés.

      ¿Cuándo se usa el katakana?

      1. PALABRAS EXTRANJERAS (préstamos): テレビ (terebi = televisión),
         コーヒー (koohii = café), タクシー (takushii = taxi).

      2. NOMBRES EXTRANJEROS: マリア (Maria), スペイン (Supein = España).

      3. ONOMATOPEYAS y efectos de sonido en cómics (manga).

      4. Énfasis, como si pusiéramos una palabra en MAYÚSCULAS.

      Diferencias visuales con el hiragana:
      - El hiragana tiene formas redondeadas y curvas (como letra cursiva).
      - El katakana tiene formas más angulares y rectas (como letra de imprenta).

      Truco para hispanohablantes:
      Muchas palabras en katakana son adaptaciones del inglés o incluso del español:
      - マンゴー (mangoo) ← mango (¡igual!)
      - タコス (takosu) ← tacos
      - パン (pan) ← pan (del portugués, pero lo reconocerás)
    tips:
      - "Busca palabras en katakana que reconozcas del español. Será tu ventaja como hispanohablante."
      - "Las vocales largas en katakana se escriben con una raya horizontal: ー (como en コーヒー)."
      - "Compara siempre el katakana con el hiragana correspondiente para ver sus diferencias."
exercises:
  - type: multiple_choice
    prompt: "¿Qué significa テレビ (terebi)?"
    options: ["teléfono", "televisión", "radio", "tablet"]
    answer: "televisión"
  - type: multiple_choice
    prompt: "¿Qué katakana representa la sílaba 'ko'?"
    options: ["カ", "キ", "ク", "コ"]
    answer: "コ"
  - type: multiple_choice
    prompt: "La palabra コーヒー (koohii) significa:"
    options: ["té", "agua", "café", "jugo"]
    answer: "café"
  - type: multiple_choice
    prompt: "¿Para qué se usa principalmente el katakana?"
    options: ["Para escribir verbos japoneses", "Para palabras extranjeras y nombres extranjeros", "Para números", "Para nombres japoneses tradicionales"]
    answer: "Para palabras extranjeras y nombres extranjeros"
  - type: multiple_choice
    prompt: "¿Cómo se escribe 'taxi' en katakana?"
    options: ["タクシー", "テクシー", "トクシー", "タキシー"]
    answer: "タクシー"
  - type: fill_blank
    prompt: "El símbolo ー en katakana indica que la vocal anterior es ___ (más larga)."
    answer: "larga"
    explanation: "La raya horizontal ー alarga la vocal anterior. コーヒー tiene dos vocales largas: 'oo' y 'ii'."
  - type: multiple_choice
    prompt: "¿Qué significa オレンジ (orenji)?"
    options: ["manzana", "uva", "naranja", "limón"]
    answer: "naranja"
  - type: multiple_choice
    prompt: "¿Cuál es la diferencia visual principal entre hiragana y katakana?"
    options: ["El hiragana es más angular; el katakana más redondeado", "El hiragana es más redondeado; el katakana más angular", "No hay diferencia visual", "El katakana tiene más caracteres"]
    answer: "El hiragana es más redondeado; el katakana más angular"
  - type: multiple_choice
    prompt: "La palabra サッカー (sakkaa) significa:"
    options: ["béisbol", "baloncesto", "tenis", "fútbol"]
    answer: "fútbol"
  - type: fill_blank
    prompt: "¿Cómo se escribe 'España' en katakana? スペ___ン"
    answer: "イ"
    explanation: "España en japonés es スペイン (Supein), adaptación del sonido español."
notes: "Lección 2 del bloque 1. El katakana es una ventaja enorme para hispanohablantes: ¡hay cientos de palabras que reconocerás!"

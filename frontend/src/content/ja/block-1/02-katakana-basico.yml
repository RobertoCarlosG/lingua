language: ja
title: "Bloque 1 · 02 — Katakana básico: palabras del mundo moderno"
level: N5
type: phonetics
description: "Aprende el katakana, el silabario que se usa principalmente para palabras extranjeras. Reconocerás muchas palabras que ya conoces en español o inglés."
objectives:
  - "Reconocer las 5 vocales del katakana (アイウエオ)"
  - "Leer katakana básico de los grupos カ, サ, タ, ナ y マ"
  - "Entender para qué se usa el katakana y por qué es diferente del hiragana"

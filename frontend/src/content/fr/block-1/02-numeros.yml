language: fr
title: "Bloque 1 · 02 — Les nombres de 1 à 20"
level: A1
type: vocabulary
description: "Aprende los números del 1 al 20 en francés. Atención: los números del 17 al 19 se forman de manera distinta al español (dix-sept = 10+7, dix-huit = 10+8, dix-neuf = 10+9)."
vocabulary:
  - word: "un / une"
    translation: "uno / una"
    example: "J'ai un frère."
    example_translation: "Tengo un hermano."
  - word: "deux"
    translation: "dos"
    example: "J'ai deux chats."
    example_translation: "Tengo dos gatos."
  - word: "trois"
    translation: "tres"
    example: "Il y a trois fenêtres."
    example_translation: "Hay tres ventanas."
  - word: "quatre"
    translation: "cuatro"
    example: "J'ai quatre stylos."
    example_translation: "Tengo cuatro bolígrafos."
  - word: "cinq"
    translation: "cinco"
    example: "Cinq élèves sont absents."
    example_translation: "Cinco alumnos están ausentes."
  - word: "six"
    translation: "seis"
    example: "Il est six heures."
    example_translation: "Son las seis."
  - word: "sept"
    translation: "siete"
    example: "Sept jours dans une semaine."
    example_translation: "Siete días en una semana."
  - word: "huit"
    translation: "ocho"
    example: "J'ai huit ans."
    example_translation: "Tengo ocho años."
  - word: "neuf"
    translation: "nueve"
    example: "Neuf plus un font dix."
    example_translation: "Nueve más uno son diez."
  - word: "dix"
    translation: "diez"
    example: "Il y a dix élèves."
    example_translation: "Hay diez alumnos."
  - word: "onze"
    translation: "once"
    example: "J'ai onze livres."
    example_translation: "Tengo once libros."
  - word: "douze"
    translation: "doce"
    example: "Douze mois dans un an."
    example_translation: "Doce meses en un año."
  - word: "treize"
    translation: "trece"
    example: "Il habite au numéro treize."
    example_translation: "Vive en el número trece."
  - word: "quatorze"
    translation: "catorce"
    example: "J'ai quatorze ans."
    example_translation: "Tengo catorce años."
  - word: "quinze"
    translation: "quince"
    example: "Quinze minutes de pause."
    example_translation: "Quince minutos de descanso."
  - word: "seize"
    translation: "dieciséis"
    example: "Il y a seize équipes."
    example_translation: "Hay dieciséis equipos."
  - word: "dix-sept"
    translation: "diecisiete"
    example: "Il est dix-sept heures."
    example_translation: "Son las diecisiete horas."
  - word: "dix-huit"
    translation: "dieciocho"
    example: "J'ai dix-huit ans."
    example_translation: "Tengo dieciocho años."
  - word: "dix-neuf"
    translation: "diecinueve"
    example: "Dix-neuf plus un font vingt."
    example_translation: "Diecinueve más uno son veinte."
  - word: "vingt"
    translation: "veinte"
    example: "Il y a vingt élèves dans la classe."
    example_translation: "Hay veinte alumnos en la clase."
exercises:
  - type: translate
    prompt: "Traduce al francés: 'cinco'"
    answer: "cinq"
  - type: multiple_choice
    prompt: "¿Cómo se dice 'doce' en francés?"
    options: ["onze", "douze", "treize", "dix"]
    answer: "douze"
  - type: fill_blank
    prompt: "Completa la secuencia: dix-sept, dix-huit, ___"
    answer: "dix-neuf"
  - type: translate
    prompt: "Traduce al francés: 'veinte'"
    answer: "vingt"
  - type: multiple_choice
    prompt: "¿Qué número es 'quatorze'?"
    options: ["13", "14", "15", "16"]
    answer: "14"
  - type: reorder
    prompt: "Ordena de menor a mayor: vingt / un / dix / cinq"
    answer: "un cinq dix vingt"
  - type: fill_blank
    prompt: "7 días en una semana: '___ jours dans une semaine.'"
    answer: "sept"
  - type: multiple_choice
    prompt: "¿Cómo se forma 'dieciséis' en francés?"
    options: ["seize", "dix-six", "six-dix", "seizième"]
    answer: "seize"
  - type: translate
    prompt: "Traduce al español: 'dix-huit'"
    answer: "dieciocho"
  - type: fill_blank
    prompt: "Hay ___ meses en un año: 'Il y a ___ mois dans un an.'"
    answer: "douze"
  - type: multiple_choice
    prompt: "'J'ai ___ ans' — tienes quince años. ¿Qué número va en el espacio?"
    options: ["quinze", "cinq", "seize", "quatorze"]
    answer: "quinze"
  - type: translate
    prompt: "Traduce al francés: 'once'"
    answer: "onze"

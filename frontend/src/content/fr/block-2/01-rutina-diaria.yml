language: fr
title: "Bloque 2 · 01 — La routine quotidienne"
level: A2
type: vocabulary
description: "Aprende el vocabulario esencial para hablar de la rutina diaria en francés: acciones cotidianas, momentos del día y verbos reflexivos frecuentes."
vocabulary:
  - word: "se lever"
    translation: "levantarse"
    example: "Je me lève à sept heures du matin."
    example_translation: "Me levanto a las siete de la mañana."
  - word: "se doucher"
    translation: "ducharse"
    example: "Elle se douche avant le petit-déjeuner."
    example_translation: "Ella se ducha antes del desayuno."
  - word: "s'habiller"
    translation: "vestirse"
    example: "Il s'habille rapidement pour aller au travail."
    example_translation: "Él se viste rápido para ir al trabajo."
  - word: "le petit-déjeuner"
    translation: "el desayuno"
    example: "Nous prenons le petit-déjeuner ensemble chaque matin."
    example_translation: "Desayunamos juntos cada mañana."
  - word: "déjeuner"
    translation: "almorzar / el almuerzo"
    example: "Je déjeune à la cafétéria avec mes collègues."
    example_translation: "Almuerzo en la cafetería con mis colegas."
  - word: "dîner"
    translation: "cenar / la cena"
    example: "On dîne en famille à vingt heures."
    example_translation: "Cenamos en familia a las ocho de la noche."
  - word: "se coucher"
    translation: "acostarse"
    example: "Les enfants se couchent à neuf heures."
    example_translation: "Los niños se acuestan a las nueve."
  - word: "travailler"
    translation: "trabajar"
    example: "Elle travaille du lundi au vendredi."
    example_translation: "Ella trabaja de lunes a viernes."
  - word: "rentrer à la maison"
    translation: "volver a casa"
    example: "Il rentre à la maison à dix-huit heures."
    example_translation: "Él vuelve a casa a las seis de la tarde."
  - word: "faire les courses"
    translation: "hacer la compra"
    example: "Je fais les courses le samedi matin."
    example_translation: "Hago la compra el sábado por la mañana."
  - word: "se brosser les dents"
    translation: "cepillarse los dientes"
    example: "Tu te brosses les dents après chaque repas."
    example_translation: "Te cepillas los dientes después de cada comida."
  - word: "regarder la télévision"
    translation: "ver la televisión"
    example: "Nous regardons la télévision le soir."
    example_translation: "Vemos la televisión por la noche."
  - word: "se reposer"
    translation: "descansar"
    example: "Le dimanche, il aime se reposer."
    example_translation: "El domingo le gusta descansar."
  - word: "le réveil"
    translation: "el despertador"
    example: "Mon réveil sonne à six heures et demie."
    example_translation: "Mi despertador suena a las seis y media."
  - word: "l'horaire"
    translation: "el horario"
    example: "Quel est ton horaire de travail cette semaine ?"
    example_translation: "¿Cuál es tu horario de trabajo esta semana?"
exercises:
  - type: multiple_choice
    prompt: "¿Cómo se dice 'levantarse' en francés?"
    options: ["se coucher", "se lever", "s'habiller", "se doucher"]
    answer: "se lever"
  - type: fill_blank
    prompt: "Je ___ à sept heures du matin. (levantarse)"
    answer: "me lève"
  - type: translate
    prompt: "Traduce al francés: 'Ella se ducha antes del desayuno.'"
    answer: "Elle se douche avant le petit-déjeuner."
  - type: multiple_choice
    prompt: "¿Cuál es el significado de 'dîner' ?"
    options: ["desayunar", "almorzar", "merendar", "cenar"]
    answer: "cenar"
  - type: fill_blank
    prompt: "Les enfants ___ à neuf heures. (acostarse)"
    answer: "se couchent"
  - type: reorder
    prompt: "Ordena las palabras para formar una oración correcta: [matin / le / prenons / petit-déjeuner / nous / chaque]"
    answer: "Nous prenons le petit-déjeuner chaque matin."
  - type: translate
    prompt: "Traduce al español: 'Je fais les courses le samedi matin.'"
    answer: "Hago la compra el sábado por la mañana."
  - type: multiple_choice
    prompt: "¿Qué significa 'le réveil' ?"
    options: ["el sueño", "el despertador", "la noche", "la mañana"]
    answer: "el despertador"
  - type: fill_blank
    prompt: "Il ___ à la maison à dix-huit heures. (volver)"
    answer: "rentre"
  - type: translate
    prompt: "Traduce al francés: 'Nos cepillamos los dientes después de cada comida.'"
    answer: "Nous nous brossons les dents après chaque repas."

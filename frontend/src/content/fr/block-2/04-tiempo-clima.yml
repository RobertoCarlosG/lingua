language: fr
title: "Bloque 2 · 04 — Le temps et le climat"
level: A2
type: vocabulary
description: "Vocabulario para hablar del tiempo meteorológico en francés: expresiones con 'il fait', fenómenos climáticos y las estaciones del año."
vocabulary:
  - word: "il fait beau"
    translation: "hace buen tiempo"
    example: "Il fait beau aujourd'hui, allons au parc !"
    example_translation: "Hace buen tiempo hoy, ¡vamos al parque!"
  - word: "il fait mauvais"
    translation: "hace mal tiempo"
    example: "Il fait mauvais ce week-end, je reste chez moi."
    example_translation: "Hace mal tiempo este fin de semana, me quedo en casa."
  - word: "il fait chaud"
    translation: "hace calor"
    example: "En juillet, il fait très chaud à Marseille."
    example_translation: "En julio hace mucho calor en Marsella."
  - word: "il fait froid"
    translation: "hace frío"
    example: "Il fait froid en hiver dans le nord de la France."
    example_translation: "Hace frío en invierno en el norte de Francia."
  - word: "il pleut"
    translation: "llueve / está lloviendo"
    example: "Il pleut tous les jours en novembre."
    example_translation: "Llueve todos los días en noviembre."
  - word: "il neige"
    translation: "nieva / está nevando"
    example: "Il neige dans les Alpes en décembre."
    example_translation: "Nieva en los Alpes en diciembre."
  - word: "il y a du vent"
    translation: "hay viento"
    example: "Il y a beaucoup de vent sur la côte aujourd'hui."
    example_translation: "Hay mucho viento en la costa hoy."
  - word: "il y a du soleil"
    translation: "hay sol"
    example: "Il y a du soleil le matin mais des nuages l'après-midi."
    example_translation: "Hay sol por la mañana pero nubes por la tarde."
  - word: "le nuage"
    translation: "la nube"
    example: "Le ciel est couvert de nuages gris."
    example_translation: "El cielo está cubierto de nubes grises."
  - word: "l'orage"
    translation: "la tormenta"
    example: "Un orage éclate souvent en été."
    example_translation: "A menudo estalla una tormenta en verano."
  - word: "la température"
    translation: "la temperatura"
    example: "La température monte à trente degrés en août."
    example_translation: "La temperatura sube a treinta grados en agosto."
  - word: "le printemps"
    translation: "la primavera"
    example: "Au printemps, les fleurs commencent à pousser."
    example_translation: "En primavera, las flores empiezan a crecer."
  - word: "l'été"
    translation: "el verano"
    example: "En été, beaucoup de Français vont à la mer."
    example_translation: "En verano, muchos franceses van al mar."
  - word: "l'automne"
    translation: "el otoño"
    example: "En automne, les feuilles deviennent rouges et jaunes."
    example_translation: "En otoño, las hojas se vuelven rojas y amarillas."
  - word: "l'hiver"
    translation: "el invierno"
    example: "En hiver, il fait nuit très tôt."
    example_translation: "En invierno anochece muy temprano."
exercises:
  - type: multiple_choice
    prompt: "¿Cómo se dice 'hace calor' en francés?"
    options: ["il fait froid", "il fait beau", "il fait chaud", "il pleut"]
    answer: "il fait chaud"
  - type: fill_blank
    prompt: "___ tous les jours en novembre. (llover)"
    answer: "Il pleut"
  - type: translate
    prompt: "Traduce al francés: 'Hay mucho viento en la costa hoy.'"
    answer: "Il y a beaucoup de vent sur la côte aujourd'hui."
  - type: multiple_choice
    prompt: "¿Qué estación del año es 'l'automne' ?"
    options: ["la primavera", "el verano", "el otoño", "el invierno"]
    answer: "el otoño"
  - type: fill_blank
    prompt: "La ___ monte à trente degrés en août. (temperatura)"
    answer: "température"
  - type: reorder
    prompt: "Ordena las palabras: [en / les / au / commencent / fleurs / pousser / printemps / à]"
    answer: "Au printemps, les fleurs commencent à pousser."
  - type: translate
    prompt: "Traduce al español: 'Il neige dans les Alpes en décembre.'"
    answer: "Nieva en los Alpes en diciembre."
  - type: multiple_choice
    prompt: "¿Qué expresión usas para decir que hay tormenta?"
    options: ["il fait beau", "il y a un orage", "il fait froid", "il y a du soleil"]
    answer: "il y a un orage"
  - type: fill_blank
    prompt: "En ___, beaucoup de Français vont à la mer. (verano)"
    answer: "été"
  - type: translate
    prompt: "Traduce al francés: 'En invierno hace frío en el norte de Francia.'"
    answer: "En hiver, il fait froid dans le nord de la France."
